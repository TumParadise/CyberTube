name: Build CyberTube APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort | head -200

      - name: Find Gradle project
        run: |
          SETTINGS=$(find . \
            \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -not -path './.git/*' \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: ไม่พบ settings.gradle.kts หรือ settings.gradle"
            echo "ต้องนำ source code ของ Android project ขึ้น GitHub ก่อน"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS")
          echo "Project root: $PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberTube-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

name: Build CyberTube APK

on:
  push:
    branches:
      - main
      - feature/account-integration-v2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: /home/runner/.android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Gradle project
        run: |
          SETTINGS=$(find . \
            \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -not -path './.git/*' \
            -print -quit)
          test -n "$SETTINGS"
          PROJECT_ROOT=$(dirname "$SETTINGS")
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Create and verify debug keystore
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          rm -f "$ANDROID_USER_HOME/debug.keystore"
          keytool -genkeypair \
            -keystore "$ANDROID_USER_HOME/debug.keystore" \
            -storetype PKCS12 \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          test -s "$ANDROID_USER_HOME/debug.keystore"
          keytool -list -v \
            -keystore "$ANDROID_USER_HOME/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | tee "$GITHUB_WORKSPACE/debug-certificate.txt"

      - name: Generate signing report
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          gradle signingReport --no-daemon | tee signing-report.txt
          grep -q "SHA1:" signing-report.txt

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload signing reports
        uses: actions/upload-artifact@v4
        with:
          name: CyberTube-Signing-Report
          path: |
            ${{ env.PROJECT_ROOT }}/signing-report.txt
            debug-certificate.txt
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberTube-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
